{% extends "base.html" %}
{% block title %}Sign in — FinWise{% endblock %}
{% block content %}
<section class="auth-card">
<h1>Welcome back</h1><p>Sign in to access your FinWise dashboard.</p>
<form method="post" class="form">
<label>Username or email<input name="identity" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn" type="submit">Sign in</button>
</form>
<p class="muted">New to FinWise? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
