<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<body style="background-color: black;">

    <nav style="background-color: black; padding: 10px;">
        <div class="main-nav container flex"
            style="display: flex; align-items: center; justify-content: space-between;">
            <!-- FinWise Branding (Shifted to align with News Cards) -->
            <ul class="flex" style="list-style: none; padding-left: 0;">
                <li style="font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: bold;">
                    <span style="color: rgb(0, 255, 55);">Fin</span><span style="color: white;">Wise</span>
                </li>
            </ul>

            <!-- Centered Navigation Links -->
            <div class="nav-links">
                <ul class="flex" style="display: flex; gap: 20px; list-style: none;">
                    <li class="hover-link nav-item" id="finance" onclick="onNavItemClick('finance')"
                        style="color: white;">Finance</li>
                    <li class="hover-link nav-item" id="stockmarket" onclick="onNavItemClick('stock market')"
                        style="color: white;">Stock Market</li>
                    <li class="hover-link nav-item" id="mutualfunds" onclick="onNavItemClick('mutual funds')"
                        style="color: white;">Mutual Funds</li>
                </ul>
            </div>

            <!-- Search Bar (Kept on Right) -->
            <div class="search-bar flex">
                <input id="search-text" type="text" class="news-input" placeholder="e.g. Science">
                <button id="search-button" class="search-button"
                    style="background-color: rgb(0, 255, 55); color: black;">Search</button>
            </div>
        </div>
    </nav>
    <main>
        <div class="cards-container container flex" id="cards-container">
        </div>
    </main>

    <template id="template-news-card">
        <div class="card">
            <div class="card-header">
                <img src="https://via.placeholder.com/400x200" alt="news-image" id="news-img">
            </div>
            <div class="card-content">
                <h3 id="news-title">This is the Title</h3>
                <h6 class="news-source" id="news-source">End Gadget 26/08/2023</h6>
                <p class="news-desc" id="news-desc">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Recusandae
                    saepe quis voluptatum quisquam vitae doloremque facilis molestias quae ratione cumque!</p>
            </div>
        </div>
    </template>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
