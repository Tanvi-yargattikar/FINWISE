<!-- HTML FILE: questionnaire.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>questionnaire</title>
    <link rel="stylesheet" href="que.css">
</head>
<body>
    <div class="container">
        <h1>Fill the form to get Personalized Financial Insights!</h1>
        <form action="/submit" method="POST">
            <label for="income">What is your total Monthly Income?</label>
            <input type="number" id="income" name="income" required>

            <label for="expenses">What is your average Monthly Expenses?</label>
            <input type="number" id="expenses" name="expenses" required>

            <label>Do you have any long-term goal?</label>
            <input type="radio" id="goal-yes" name="long_term_goal" value="yes" required>
            <label for="goal-yes">Yes</label>

            <input type="radio" id="goal-no" name="long_term_goal" value="no" required>
            <label for="goal-no">No</label>

            <!-- Goal Importance Dropdown (Hidden by Default) -->
            <div id="goal-importance-section" class="hidden">
                <label for="goal-importance">How important is your long-term goal?</label>
                <select id="goal-importance" name="goal_importance">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div id="long-importance-section" class="hidden">
                <label for="long-importance">How important is your long-term goal?</label>
                <select id="long-importance" name="long_importance">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <label>Do you have any short-term goal?</label>
            <input type="radio" id="short-yes" name="short_term_goal" value="yes" required>
            <label for="short-yes">Yes</label>
            <input type="radio" id="short-no" name="short_term_goal" value="no" required>
            <label for="short-no">No</label>

            <div id="short-importance-section" class="hidden">
                <label for="short-importance">How important is your short-term goal?</label>
                <select id="short-importance" name="short_importance">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <label>Would you like to invest a portion of your leftover income?</label>
            <input type="radio" id="invest-yes" name="invest" value="yes" required>
            <label for="invest-yes">Yes</label>
            <input type="radio" id="invest-no" name="invest" value="no" required>
            <label for="invest-no">No</label>

            <div id="investment-options" class="hidden">
                <label for="risk">What is your risk preference?</label>
                <select id="risk" name="risk">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>

                <label for="investment-type">What type of investment do you prefer?</label>
                <select id="investment-type" name="investment_type">
                    <option value="stocks">Stocks</option>
                    <option value="mutual_funds">Mutual Funds</option>
                    <option value="both">Both</option>
                </select>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        document.querySelectorAll('input[name="long_term_goal"]').forEach((radio) => {
            radio.addEventListener('change', function() {
                document.getElementById('long-importance-section').style.display = 
                    this.value === 'yes' ? 'block' : 'none';
            });
        });

        document.querySelectorAll('input[name="short_term_goal"]').forEach((radio) => {
            radio.addEventListener('change', function() {
                document.getElementById('short-importance-section').style.display = 
                    this.value === 'yes' ? 'block' : 'none';
            });
        });

        document.querySelectorAll('input[name="invest"]').forEach((radio) => {
            radio.addEventListener('change', function() {
                document.getElementById('investment-options').style.display = 
                    this.value === 'yes' ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
